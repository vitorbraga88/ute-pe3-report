<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="description" content="Relatorios antigos - UTE Pernambuco III">
  <link rel="manifest" href="manifest.json">
  <title>UTE-PE3 — Relatórios Antigos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#1e40af">
  <style>
    .relatorios-header { display: flex; align-items: center; gap: 10px; }
    .relatorios-header .back-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,.15);
      color: #fff; text-decoration: none; font-size: 1.2rem; flex-shrink: 0;
    }
    .relatorios-header .back-link:active { background: rgba(255,255,255,.28); }
    .filters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .filters-grid .form-group.full { grid-column: 1 / -1; }
    .filter-actions { display: flex; gap: 8px; margin-top: 4px; }
    .filter-actions .btn { flex: 1; min-height: 46px; }
    .result-item {
      display: flex; flex-direction: column; gap: 6px; padding: 14px;
      border: 1px solid var(--gray-200); border-radius: 10px; margin-bottom: 10px; background: #fff;
    }
    .result-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .result-os { font-weight: 700; color: var(--primary); font-size: 0.98rem; }
    .result-meta { font-size: 0.8rem; color: var(--gray-500); }
    .result-desc { font-size: 0.9rem; color: var(--gray-800); }
    .result-tags { font-size: 0.78rem; color: var(--gray-600); }
    .result-actions { display: flex; gap: 8px; margin-top: 4px; }
    .result-actions .btn { flex: 1; min-height: 40px; font-size: 0.82rem; }
    #load-more { margin-top: 6px; }
    #total-count { font-size: 0.82rem; color: var(--gray-500); margin: 4px 0 10px; }
    #empty-state { text-align: center; color: var(--gray-500); padding: 30px 10px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header class="header">
    <div class="relatorios-header">
      <a href="index.html" class="back-link" title="Voltar à aplicação">←</a>
      <div>
        <h1>Relatórios Antigos</h1>
        <div class="header-sub">Busca com filtros — UTE Pernambuco III</div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div class="card-title"><span class="icon">🔎</span> Filtros</div>
      <div class="filters-grid">
        <div class="form-group full">
          <label for="f-q">Busca livre (descrição, local)</label>
          <input type="text" id="f-q" placeholder="Ex.: filtro de óleo">
        </div>
        <div class="form-group">
          <label for="f-os">Número da OS</label>
          <input type="text" id="f-os" inputmode="numeric" placeholder="202607">
        </div>
        <div class="form-group">
          <label for="f-status">Status</label>
          <select id="f-status">
            <option value="">Todos</option>
            <option value="Aberto">Aberto</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Finalizado">Finalizado</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-supervisor">Supervisor</label>
          <input type="text" id="f-supervisor" placeholder="Nome">
        </div>
        <div class="form-group">
          <label for="f-tecnico">Técnico</label>
          <input type="text" id="f-tecnico" placeholder="Nome">
        </div>
        <div class="form-group">
          <label for="f-data-de">Data de</label>
          <input type="date" id="f-data-de">
        </div>
        <div class="form-group">
          <label for="f-data-ate">Data até</label>
          <input type="date" id="f-data-ate">
        </div>
      </div>
      <div class="filter-actions">
        <button type="button" class="btn btn-secondary" onclick="UTE_PE3.Relatorios.limpar()">Limpar</button>
        <button type="button" class="btn btn-primary" onclick="UTE_PE3.Relatorios.buscar(true)">🔎 Filtrar</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📄</span> Resultados</div>
      <div id="total-count"></div>
      <div id="results-list"></div>
      <div id="empty-state" style="display:none">Nenhum relatório encontrado com esses filtros.</div>
      <button type="button" class="btn btn-secondary btn-block" id="load-more" style="display:none" onclick="UTE_PE3.Relatorios.buscar(false)">Carregar mais</button>
    </div>
  </main>

  <div id="toast-container"></div>

  <script src="js/relatorios.js"></script>
</body>
</html>
